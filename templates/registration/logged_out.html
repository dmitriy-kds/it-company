{% extends "base.html" %}

{% block title %}<title>Logged Out — Task Manager</title>{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card" style="text-align: center;">

    <div class="auth-label" style="margin-bottom: 1rem;">Task Manager</div>

    <div class="logout-icon">◎</div>
    <h1 class="auth-title" style="margin-bottom: 0.5rem;">Signed out</h1>
    <p class="logout-subtitle">You have been signed out successfully.</p>

    <a href="{% url 'login' %}" class="auth-submit" style="display: block; text-decoration: none; margin-top: 1.5rem;">
      Sign back in →
    </a>

  </div>
</div>
{% endblock %}
